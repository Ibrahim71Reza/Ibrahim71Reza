<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Animated Arc4n3 Linux terminal profile</title>
  <desc id="desc">An animated Linux terminal introducing Md. Ibrahim Reza Rabbi, offensive security practitioner, CTF player, Kali Linux user and software engineer.</desc>

  <defs>
    <linearGradient id="terminalBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#07111d"/>
      <stop offset="1" stop-color="#031a15"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="type1"><rect x="55" y="76" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;430;430;430" keyTimes="0;0.03;0.14;0.96;1"/></rect></clipPath>
    <clipPath id="type2"><rect x="55" y="112" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;660;660;660" keyTimes="0;0.15;0.25;0.96;1"/></rect></clipPath>
    <clipPath id="type3"><rect x="55" y="158" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;570;570;570" keyTimes="0;0.27;0.38;0.96;1"/></rect></clipPath>
    <clipPath id="type4"><rect x="55" y="194" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;820;820;820" keyTimes="0;0.39;0.53;0.96;1"/></rect></clipPath>
    <clipPath id="type5"><rect x="55" y="230" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;760;760;760" keyTimes="0;0.54;0.66;0.96;1"/></rect></clipPath>
    <clipPath id="type6"><rect x="55" y="276" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;480;480;480" keyTimes="0;0.68;0.77;0.96;1"/></rect></clipPath>
    <clipPath id="type7"><rect x="55" y="312" width="0" height="28"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;850;850;850" keyTimes="0;0.78;0.91;0.96;1"/></rect></clipPath>
    <clipPath id="type8"><rect x="55" y="358" width="0" height="30"><animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;360;360;360" keyTimes="0;0.92;0.965;0.985;1"/></rect></clipPath>
  </defs>

  <rect x="18" y="18" width="1064" height="394" rx="20" fill="url(#terminalBg)" stroke="#10b981" stroke-width="2" filter="url(#shadow)"/>
  <rect x="19" y="19" width="1062" height="48" rx="19" fill="url(#topBar)"/>
  <rect x="19" y="50" width="1062" height="17" fill="url(#topBar)"/>

  <circle cx="49" cy="43" r="7" fill="#ff5f56"/>
  <circle cx="73" cy="43" r="7" fill="#ffbd2e"/>
  <circle cx="97" cy="43" r="7" fill="#27c93f"/>
  <text x="550" y="49" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">root@Arc4n3 — kali-linux</text>

  <rect x="34" y="80" width="3" height="292" fill="#10b981" opacity="0.28">
    <animate attributeName="opacity" values="0.18;0.65;0.18" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">
    <g clip-path="url(#type1)">
      <text x="55" y="98"><tspan fill="#34d399">root@Arc4n3</tspan><tspan fill="#cbd5e1">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#cbd5e1"># whoami</tspan></text>
    </g>

    <g clip-path="url(#type2)">
      <text x="55" y="134" fill="#f8fafc">Md. Ibrahim Reza Rabbi  ·  alias: Arc4n3</text>
    </g>

    <g clip-path="url(#type3)">
      <text x="55" y="180"><tspan fill="#34d399">root@Arc4n3</tspan><tspan fill="#cbd5e1">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#cbd5e1"># cat operator.conf</tspan></text>
    </g>

    <g clip-path="url(#type4)">
      <text x="55" y="216"><tspan fill="#fbbf24">ROLE</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#f8fafc">Software Engineer · Security Tool Builder</tspan></text>
    </g>

    <g clip-path="url(#type5)">
      <text x="55" y="252"><tspan fill="#fbbf24">FOCUS</tspan><tspan fill="#94a3b8">=</tspan><tspan fill="#f8fafc">Offensive Security · CTF · Kali Linux · Applied AI</tspan></text>
    </g>

    <g clip-path="url(#type6)">
      <text x="55" y="298"><tspan fill="#34d399">root@Arc4n3</tspan><tspan fill="#cbd5e1">:</tspan><tspan fill="#60a5fa">~</tspan><tspan fill="#cbd5e1"># ./mission.sh</tspan></text>
    </g>

    <g clip-path="url(#type7)">
      <text x="55" y="334" fill="#f8fafc">Building secure systems with measurable real-world impact...</text>
    </g>

    <g clip-path="url(#type8)" filter="url(#glow)">
      <text x="55" y="380"><tspan fill="#34d399">[✓]</tspan><tspan fill="#f8fafc"> STATUS: READY</tspan></text>
    </g>
  </g>

  <rect x="238" y="360" width="12" height="24" rx="1" fill="#34d399">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.48;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect x="18" y="18" width="1064" height="394" rx="20" fill="none" stroke="#34d399" stroke-width="1" opacity="0.15" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.28;0.08" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <rect x="34" y="70" width="1032" height="2" fill="#10b981" opacity="0.08">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 320;0 0" keyTimes="0;0.88;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.13;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
