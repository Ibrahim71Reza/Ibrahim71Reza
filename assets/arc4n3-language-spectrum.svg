<svg xmlns="http://www.w3.org/2000/svg" width="540" height="236" viewBox="0 0 540 236" role="img" aria-labelledby="title desc">
  <title id="title">Arc4n3 language spectrum</title>
  <desc id="desc">A colorful static language and stack mix chart for the Arc4n3 GitHub profile.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.55" stop-color="#07111d"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="0.75" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="538" height="234" rx="8" fill="url(#bg)" stroke="#22d3ee" stroke-width="1.3"/>
  <rect x="20" y="20" width="500" height="4" rx="2" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.45;1;0.45" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <text x="30" y="58" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="700">Stack Spectrum</text>
  <text x="30" y="82" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">Linux-first engineering across security, web, AI, and systems.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    <text x="30" y="119" fill="#cbd5e1">Python</text>
    <rect x="130" y="107" width="332" height="14" rx="7" fill="#0f172a"/>
    <rect x="130" y="107" width="286" height="14" rx="7" fill="#10b981"/>

    <text x="30" y="147" fill="#cbd5e1">TypeScript</text>
    <rect x="130" y="135" width="332" height="14" rx="7" fill="#0f172a"/>
    <rect x="130" y="135" width="238" height="14" rx="7" fill="#22d3ee"/>

    <text x="30" y="175" fill="#cbd5e1">C++ / Rust</text>
    <rect x="130" y="163" width="332" height="14" rx="7" fill="#0f172a"/>
    <rect x="130" y="163" width="194" height="14" rx="7" fill="#a78bfa"/>

    <text x="30" y="203" fill="#cbd5e1">Bash / Linux</text>
    <rect x="130" y="191" width="332" height="14" rx="7" fill="#0f172a"/>
    <rect x="130" y="191" width="260" height="14" rx="7" fill="#f472b6"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="474" cy="114" r="5" fill="#10b981"/>
    <circle cx="474" cy="142" r="5" fill="#22d3ee"/>
    <circle cx="474" cy="170" r="5" fill="#a78bfa"/>
    <circle cx="474" cy="198" r="5" fill="#f472b6"/>
  </g>
</svg>
