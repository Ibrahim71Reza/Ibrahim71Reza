<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">Arc4n3 GitHub command center</title>
  <desc id="desc">A colorful Linux terminal dashboard with repository, stack, research, and activity signals.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#031b2d;#020617" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#052e2b">
        <animate attributeName="stop-color" values="#052e2b;#111827;#052e2b" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#4c0519;#1e1b4b" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="0.8" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="12" y="12" width="1076" height="406" rx="12" fill="url(#bg)" stroke="#10b981" stroke-width="1.6"/>
  <rect x="12" y="12" width="1076" height="48" rx="12" fill="#0f172a" opacity="0.92"/>
  <rect x="12" y="48" width="1076" height="12" fill="#0f172a" opacity="0.92"/>
  <circle cx="43" cy="36" r="7" fill="#ff5f56"/>
  <circle cx="68" cy="36" r="7" fill="#ffbd2e"/>
  <circle cx="93" cy="36" r="7" fill="#27c93f"/>
  <text x="125" y="42" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">arc4n3@kali:~/github --command-center</text>

  <text x="40" y="98" fill="#22d3ee" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18">$ ./profile-scan --focus security --style linux</text>
  <text x="40" y="133" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700">GitHub Activity Command Center</text>
  <text x="42" y="161" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">Secure engineering, CTF operations, applied AI, and research signals in one profile cockpit.</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <rect x="42" y="196" width="224" height="90" rx="8" fill="#020617" stroke="#10b981" stroke-width="1"/>
    <text x="66" y="232" fill="#34d399" font-size="15">REPO MODE</text>
    <text x="66" y="263" fill="#f8fafc" font-size="24" font-weight="700">Builder</text>

    <rect x="292" y="196" width="224" height="90" rx="8" fill="#020617" stroke="#22d3ee" stroke-width="1"/>
    <text x="316" y="232" fill="#67e8f9" font-size="15">SECURITY</text>
    <text x="316" y="263" fill="#f8fafc" font-size="24" font-weight="700">Offensive Labs</text>

    <rect x="542" y="196" width="224" height="90" rx="8" fill="#020617" stroke="#a78bfa" stroke-width="1"/>
    <text x="566" y="232" fill="#c4b5fd" font-size="15">STACK</text>
    <text x="566" y="263" fill="#f8fafc" font-size="24" font-weight="700">Full-Stack + AI</text>

    <rect x="792" y="196" width="224" height="90" rx="8" fill="#020617" stroke="#f472b6" stroke-width="1"/>
    <text x="816" y="232" fill="#f9a8d4" font-size="15">RESEARCH</text>
    <text x="816" y="263" fill="#f8fafc" font-size="24" font-weight="700">IEEE Papers</text>
  </g>

  <g opacity="0.96">
    <line x1="52" y1="352" x2="1018" y2="352" stroke="#1f2937" stroke-width="2"/>
    <line x1="52" y1="322" x2="1018" y2="322" stroke="#1f2937" stroke-width="1"/>
    <line x1="52" y1="292" x2="1018" y2="292" stroke="#1f2937" stroke-width="1"/>
    <path d="M52 346 C95 311, 130 329, 172 298 S248 293, 292 323 S375 369, 426 316 S508 255, 566 286 S648 348, 704 316 S790 257, 850 291 S947 349, 1018 276" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="1 1200;1200 0;1 1200" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M52 346 C95 311, 130 329, 172 298 S248 293, 292 323 S375 369, 426 316 S508 255, 566 286 S648 348, 704 316 S790 257, 850 291 S947 349, 1018 276 L1018 352 L52 352 Z" fill="url(#accent)" opacity="0.12"/>
    <circle cx="426" cy="316" r="5" fill="#22d3ee"/>
    <circle cx="566" cy="286" r="5" fill="#a78bfa"/>
    <circle cx="850" cy="291" r="5" fill="#f472b6"/>
    <circle cx="1018" cy="276" r="5" fill="#fbbf24"/>
  </g>

  <rect x="-260" y="60" width="260" height="340" fill="url(#scan)" opacity="0.45">
    <animateTransform attributeName="transform" type="translate" values="0 0;1360 0;1360 0" keyTimes="0;0.82;1" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="42" y="393" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">live cards below keep tracking public GitHub streak/activity; local panels keep the profile readable if third-party cards throttle.</text>
</svg>
