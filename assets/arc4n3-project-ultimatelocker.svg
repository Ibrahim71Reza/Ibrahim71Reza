<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-labelledby="title desc">
  <title id="title">UltimateLocker repository card</title>
  <desc id="desc">A Linux terminal themed repository card for the UltimateLocker project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#042f2e;#020617" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.58" stop-color="#164e63">
        <animate attributeName="stop-color" values="#164e63;#111827;#164e63" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#3f1d2e;#111827" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.5" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="538" height="188" rx="8" fill="url(#bg)" stroke="#34d399" stroke-width="1.4"/>
  <rect x="1" y="1" width="538" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <rect x="1" y="30" width="538" height="10" fill="#0f172a" opacity="0.9"/>
  <circle cx="26" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="5" fill="#27c93f"/>
  <text x="82" y="25" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">arc4n3@kali:~/systems</text>

  <text x="24" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <tspan fill="#fbbf24">$</tspan><tspan fill="#cbd5e1"> vaultctl inspect --safe</tspan>
  </text>
  <text x="24" y="99" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="27" font-weight="700">ULTIMATELOCKER</text>
  <text x="24" y="124" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">System utility | protection workflow | tooling</text>
  <text x="24" y="151" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">policy: privacy-first | local control</text>

  <g opacity="0.96" filter="url(#glow)">
    <rect x="374" y="85" width="92" height="62" rx="8" fill="#020617" stroke="url(#accent)" stroke-width="2"/>
    <path d="M396 85 V70 C396 48 444 48 444 70 V85" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round"/>
    <circle cx="420" cy="115" r="10" fill="#fbbf24"/>
    <rect x="416" y="122" width="8" height="15" rx="4" fill="#fbbf24"/>
    <path d="M326 145 H505" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <path d="M326 145 L350 128 L374 138 L398 104 L422 116 L446 92 L470 106 L505 74" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="stroke-dasharray" values="1 200;200 0;1 200" dur="7s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="16" y="172" width="508" height="2" fill="url(#accent)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
