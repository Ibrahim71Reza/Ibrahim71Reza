<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-labelledby="title desc">
  <title id="title">dnsRecon repository card</title>
  <desc id="desc">A Linux terminal themed repository card for the dnsRecon project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#031b2d;#020617" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.56" stop-color="#082f49">
        <animate attributeName="stop-color" values="#082f49;#052e2b;#082f49" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#1e1b4b;#111827" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#10b981"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="538" height="188" rx="8" fill="url(#bg)" stroke="#22d3ee" stroke-width="1.4"/>
  <rect x="1" y="1" width="538" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <rect x="1" y="30" width="538" height="10" fill="#0f172a" opacity="0.9"/>
  <circle cx="26" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="5" fill="#27c93f"/>
  <text x="82" y="25" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">arc4n3@kali:~/recon</text>

  <text x="24" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <tspan fill="#10b981">$</tspan><tspan fill="#cbd5e1"> dig +trace target.zone</tspan>
  </text>
  <text x="24" y="99" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="29" font-weight="700">dnsRecon</text>
  <text x="24" y="124" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">DNS enumeration | mapping | recon workflow</text>
  <text x="24" y="151" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">records: A MX TXT NS CNAME | zone signal</text>

  <g opacity="0.95" filter="url(#glow)">
    <circle cx="394" cy="105" r="46" fill="none" stroke="#164e63" stroke-width="2"/>
    <circle cx="394" cy="105" r="5" fill="#22d3ee"/>
    <circle cx="335" cy="74" r="4" fill="#10b981"/>
    <circle cx="456" cy="69" r="4" fill="#a78bfa"/>
    <circle cx="469" cy="132" r="4" fill="#f472b6"/>
    <circle cx="342" cy="142" r="4" fill="#fbbf24"/>
    <line x1="394" y1="105" x2="335" y2="74" stroke="url(#accent)" stroke-width="2"/>
    <line x1="394" y1="105" x2="456" y2="69" stroke="url(#accent)" stroke-width="2"/>
    <line x1="394" y1="105" x2="469" y2="132" stroke="url(#accent)" stroke-width="2"/>
    <line x1="394" y1="105" x2="342" y2="142" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="394" cy="105" r="34" fill="none" stroke="url(#accent)" stroke-width="2" stroke-dasharray="8 10">
      <animateTransform attributeName="transform" type="rotate" from="0 394 105" to="360 394 105" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="16" y="172" width="508" height="2" fill="url(#accent)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
