<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-labelledby="title desc">
  <title id="title">Password Finder repository card</title>
  <desc id="desc">A Linux terminal themed repository card for the Password Finder project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#031b2d;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.54" stop-color="#052e2b">
        <animate attributeName="stop-color" values="#052e2b;#0f172a;#052e2b" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#102a43;#111827" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="538" height="188" rx="8" fill="url(#bg)" stroke="#10b981" stroke-width="1.4"/>
  <rect x="1" y="1" width="538" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <rect x="1" y="30" width="538" height="10" fill="#0f172a" opacity="0.9"/>
  <circle cx="26" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="5" fill="#27c93f"/>
  <text x="82" y="25" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">arc4n3@kali:~/tools</text>

  <text x="24" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <tspan fill="#22d3ee">$</tspan><tspan fill="#cbd5e1"> load password_finder</tspan>
  </text>
  <text x="24" y="99" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="27" font-weight="700">PASSWORD_FINDER</text>
  <text x="24" y="124" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">Credential hygiene | auditing | automation</text>
  <text x="24" y="151" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">status: maintained  mode: authorized-use</text>

  <g opacity="0.95">
    <rect x="337" y="70" width="9" height="76" rx="3" fill="#10b981"/>
    <rect x="358" y="92" width="9" height="54" rx="3" fill="#22d3ee"/>
    <rect x="379" y="83" width="9" height="63" rx="3" fill="#a78bfa"/>
    <rect x="400" y="58" width="9" height="88" rx="3" fill="#f472b6"/>
    <rect x="421" y="102" width="9" height="44" rx="3" fill="#fbbf24"/>
    <rect x="442" y="74" width="9" height="72" rx="3" fill="#34d399"/>
    <polyline points="332,143 350,117 371,126 392,91 414,107 437,79 466,96 504,57" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="1 180;180 0;1 180" dur="7s" repeatCount="indefinite"/>
    </polyline>
    <text x="338" y="166" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">signal: secret-pattern scan</text>
  </g>

  <rect x="16" y="172" width="508" height="2" fill="url(#accent)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
