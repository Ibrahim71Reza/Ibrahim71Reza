<svg xmlns="http://www.w3.org/2000/svg" width="540" height="190" viewBox="0 0 540 190" role="img" aria-labelledby="title desc">
  <title id="title">Frequency Cipher Cracker repository card</title>
  <desc id="desc">A Linux terminal themed repository card for the Frequency Cipher Cracker project.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617">
        <animate attributeName="stop-color" values="#020617;#172554;#020617" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#312e81">
        <animate attributeName="stop-color" values="#312e81;#052e2b;#312e81" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#111827">
        <animate attributeName="stop-color" values="#111827;#4c0519;#111827" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="538" height="188" rx="8" fill="url(#bg)" stroke="#a78bfa" stroke-width="1.4"/>
  <rect x="1" y="1" width="538" height="38" rx="8" fill="#0f172a" opacity="0.9"/>
  <rect x="1" y="30" width="538" height="10" fill="#0f172a" opacity="0.9"/>
  <circle cx="26" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="5" fill="#27c93f"/>
  <text x="82" y="25" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">arc4n3@kali:~/crypto</text>

  <text x="24" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <tspan fill="#f472b6">$</tspan><tspan fill="#cbd5e1"> solve --freq cipher.txt</tspan>
  </text>
  <text x="24" y="99" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="700">FREQUENCY CIPHER</text>
  <text x="24" y="124" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">Classical crypto | scoring | substitution hints</text>
  <text x="24" y="151" fill="#f0abfc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">etaoin-shrdlu trace | challenge toolkit</text>

  <g opacity="0.95">
    <rect x="332" y="116" width="13" height="30" rx="3" fill="#22d3ee"/>
    <rect x="351" y="84" width="13" height="62" rx="3" fill="#a78bfa"/>
    <rect x="370" y="101" width="13" height="45" rx="3" fill="#f472b6"/>
    <rect x="389" y="70" width="13" height="76" rx="3" fill="#10b981"/>
    <rect x="408" y="95" width="13" height="51" rx="3" fill="#fbbf24"/>
    <rect x="427" y="58" width="13" height="88" rx="3" fill="#34d399"/>
    <rect x="446" y="108" width="13" height="38" rx="3" fill="#60a5fa"/>
    <rect x="465" y="77" width="13" height="69" rx="3" fill="#fb7185"/>
    <path d="M330 145 C360 102, 376 112, 402 84 S450 68, 494 98" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="1 190;190 0;1 190" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="336" y="166" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11">freq peaks: E T A O I N</text>
  </g>

  <rect x="16" y="172" width="508" height="2" fill="url(#accent)" opacity="0.7">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
